{% extends 'webapp/home.html' %}
{% block content %}

<div id="app">
    <div v-if="loading" class="overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <div class="row">
        <!-- 左側：登入區塊 -->
        <div class="col-md-3">
            <div class="bg-gradient-light p-3 rounded shadow-sm">
                <h3 class="mb-3">登入資訊</h3>
                <div class="form-group">
                    <label>帳號</label>
                    <input v-model="username" type="text" class="form-control" placeholder="請輸入帳號" v-on:keyup.enter="btnConfirm">
                </div>
                <div class="form-group mt-3">
                    <label>密碼</label>
                    <input v-model="password" type="password" class="form-control" placeholder="請輸入密碼" v-on:keyup.enter="btnConfirm">
                </div>
                <div class="form-group mt-3">
                    <label>起始日期</label>
                    <input v-model="startDate" type="date" class="form-control">
                </div>

                <div class="form-group mt-3">
                    <label>結束日期</label>
                    <input v-model="endDate" type="date" class="form-control">
                </div>

                <div class="form-check mt-3">
                    <input v-model="headless" type="checkbox" id="headless" class="form-check-input">
                    <label for="headless" class="form-check-label">開啟有頭模式</label>
                </div>

                <div class="mt-4 d-flex justify-content-between">
                    <input type="button" v-on:click="btnConfirm" class="btn btn-primary" value="確　定" />
                    <input type="button" v-on:click="btnCancel" class="btn btn-secondary" value="取　消" />
                </div>
                <div class="mt-4 p-3 border rounded" style="font-size: 0.875rem; line-height: 1.5;">
                    <strong>說明事項：</strong>
                    <ul class="mb-0">
                        <br>
                        <li>資料來源：財政部電子發票整合服務平台首頁，<a href="https://www.einvoice.nat.gov.tw/" target="_blank">https://www.einvoice.nat.gov.tw/</a></li>
                        <li>依統一發票使用辦法第7條規定，營業人應於發票開立後48小時內將發票資訊傳輸至本平台，方能查詢。</li>
                        <li>線上查詢發票範圍：配合發票對獎，雙月可查詢本期在內最近4期，單月為最近5期(例:於10月可查詢3-10月的發票、於9月可查詢1-9月的發票)，每次查詢區間須為同1個月。</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 右側：ve-table -->
        <div class="col-md-9">
            <div class="p-3 rounded shadow-sm bg-white">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="mb-0">發票資訊</h3>
                    <!-- 匯出 Excel 按鈕靠右 -->
                    <button @click="exportExcel" class="btn btn-success text-white">
                        匯成 EXCEL
                    </button>
                </div>
                <ve-table :columns="columns"
                          :table-data="tableData"
                          :border-x="true"
                          :border-y="true"
                          :sort-option="sortOption"
                          max-height="calc(100vh - 150px)"
                          :clipboard-option="clipboardOption"
                          row-key-field-name="發票號碼"
                          :virtual-scroll-option="virtualScrollOption"
                >
                </ve-table>
            </div>
        </div>
    </div>
</div>

<!-- Vue 實例 -->
<script>
  new Vue({
    el: "#app",
    data: function () {
      return {
        loading: false,
        virtualScrollOption: {
          // 開啟虛擬滾動
          enable: true,
          rowHeight: 40
        },
        sortOption: {
          sortChange: (params) => {
              this.sortChange(params);
          },
        },
        clipboardOption: {
          copy: true,
          paste: false,
          cut: false,
          delete: false
        },
        username: '',
        password: '',
        startDate: '',
        endDate: '',
        headless: false,
        columns: [
          { field: "載具自訂名稱", key: "a", title: "載具自訂名稱", align: "center" },
          { field: "發票號碼", key: "b", title: "發票號碼", align: "center" },
          { field: "發票金額", key: "c", title: "發票金額", align: "right" },
          { field: "發票日期", key: "d", title: "發票日期", align: "center", sortBy: "" },
          { field: "出處", key: "e", title: "出處", align: "left" },
        ],
        tableData: []
      };
    },
    methods: {
      btnConfirm() {
        if (!this.username || !this.password || !this.startDate || !this.endDate) {
          Swal.fire({
            icon: 'warning',
            title: '資料不完整',
            text: '請完整填寫帳號、密碼、起始日期與結束日期',
            confirmButtonText: '確定'
          });
          return; // 不送後端
        }

       this.loading = true;

        fetch('invoice_login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify({
            username: this.username,
            password: this.password,
            startDate: this.startDate,
            endDate: this.endDate,
            headless: this.headless
          })
        })
        .then(response => response.json())
        .then(data => {
          this.loading = false;
          if (data.status === 'success') {
            this.tableData = [];
            this.tableData = data.data;  // 登入成功後更新表格資料
          } else {
            Swal.fire({
                icon: 'error',
                title: '登入失敗',
                text: data.message,
                confirmButtonText: '確定'
              });
          }
        })
        .catch(error => {
          this.loading = false;
          console.error('錯誤:', error);
            Swal.fire({
            icon: 'error',
            title: '伺服器錯誤',
            text: '請稍後再試',
            confirmButtonText: '確定'
          });
        });
      },
      btnCancel() {
        this.username = '';
        this.password = '';
      },
      exportExcel() {
        if (!this.tableData.length) {
          Swal.fire({
            icon: 'warning',
            title: '沒有資料',
            text: '表格沒有資料可以匯出',
            confirmButtonText: '確定'
          });
          return;
        }
        // 轉換成 SheetJS 可用的格式
        const ws = XLSX.utils.json_to_sheet(this.tableData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "發票資料");
        XLSX.writeFile(wb, `發票資料_${this.startDate}_${this.endDate}.xlsx`);
      },
      sortChange(params) {
        console.log(params.發票日期);

        this.tableData.sort((a, b) => {
            if (params.發票日期) {
                const dateA = new Date(a.發票日期);
                const dateB = new Date(b.發票日期);

                if (params.發票日期 === "asc") {
                    return dateA - dateB;
                } else if (params.發票日期 === "desc") {
                    return dateB - dateA;
                } else {
                    return 0;
                }
            }
        });
      },
    }
  });
</script>
<style>
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0,0,0,0.4); /* 半透明黑色 */
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
</style>

{% endblock %}
