{% extends 'webapp/home.html' %}

{% block title %}菜單{% endblock %}

{% block content %}
  <div class="container mt-4">
    <div class="row justify-content-center">
      {% for product in products %}
        <div class="col-md-4 d-flex align-items-stretch mb-4">
          <div class="card w-100">
            {% if product.image_url %}
              <img src="{{ product.image_url }}" class="card-img-top" alt="{{ product.name }}" style="height: 200px; object-fit: cover;">
            {% endif %}
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{ product.id }} - {{ product.name }}</h5>
              <p class="card-text">{{ product.description }}</p>
              <div class="d-flex justify-content-between align-items-center mt-auto">
                <span class="font-weight-bold">NT${{ product.price }}</span>
                <div class="d-flex align-items-center">
                  <label for="quantity-{{ product.id }}" class="mr-2 mb-0">數量</label>
                  <input type="number" min="1" value="1" class="form-control" style="width: 60px; height: 30px;" id="quantity-{{ product.id }}">
                </div>
              </div>
              <a href="#" class="btn btn-primary mt-2" onclick="orderProduct({{ product.id }})">訂購</a>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
<script>
  function orderProduct(productId) {
    const quantityInput = document.getElementById(`quantity-${productId}`);
    const quantity = parseInt(quantityInput.value) || 1;

    fetch('order-product', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': '{{ csrf_token }}'  // 確保 CSRF token 有傳送
      },
      body: JSON.stringify({
        product_id: productId,
        quantity: quantity
      })
    })
    .then(response => {
      if (response.ok) {
        alert('訂購成功！');
      } else {
        alert('訂購失敗，請稍後再試。');
      }
    });
  }
</script>
{% endblock %}
